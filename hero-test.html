<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>99 Media Hero Test</title>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
}

.hero{
position:relative;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
}

.content{
position:relative;
z-index:2;
max-width:1000px;
padding:20px;
}

.logo{
width:120px;
margin-bottom:30px;
}

h1{
font-size:clamp(3rem,8vw,7rem);
line-height:.95;
margin:0;
font-weight:800;
}

.gold{
color:#C8A24A;
}

p{
font-size:1.3rem;
max-width:800px;
margin:30px auto;
}

.btn{
display:inline-block;
padding:16px 32px;
margin:10px;
background:#C8A24A;
color:black;
text-decoration:none;
font-weight:bold;
border-radius:6px;
}
</style>

</head>

<body>

<section class="hero">

<video autoplay muted loop playsinline>
<source src="assets/download.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">

<img class="logo" src="YOUR_LOGO_URL_HERE">

<h1>
BUILDING BRANDS<br>
<span class="gold">AT CITY SCALE</span>
</h1>

<p>
Premium outdoor media across India's most influential locations.
</p>

<a href="#" class="btn">VIEW INVENTORY</a>

</div>

</section>

</body>
</html>
